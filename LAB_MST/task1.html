<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Create Post</title>
  <style>
    body {
      font-family: sans-serif;
      background: rgb(240, 245, 250);
      display: grid;
      place-items: center;
      min-height: 800px;
      margin: 0px;
    }

    form {
      background: rgb(255, 255, 255);
      padding: 32px;
      border-radius: 12px;
      width: 320px;
    }

    h2 {
      margin-top: 0px;
      color: rgb(47, 79, 79);
    }

    label {
      display: block;
      margin: 10px 0px 5px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid rgb(192, 192, 192);
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: blue;
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .msg {
      display: none;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    #success {
      color: green;
    }

    #error {
      color: red;
    }
  </style>
</head>

<body>

  <form id="postForm">
    <h2>New Post</h2>
    <label>Title</label>
    <input type="text" id="title" required>

    <label>Body</label>
    <textarea id="body" rows="4" required></textarea>

    <button type="submit" id="btn">Submit Post</button>

    <div id="success" class="msg">Post submitted successfully.</div>
    <div id="error" class="msg">Submission failed.</div>
  </form>

  <script>
    const form = document.getElementById('postForm');
    const success = document.getElementById('success');
    const error = document.getElementById('error');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const body = document.getElementById('body').value;

      try {
        const res = await fetch('https://jsonplaceholder.typicode.com/posts', {
          method: 'POST',
          body: JSON.stringify({ title, body }),
          headers: { 'Content-type': 'application/json' }
        });

        success.style.display = res.ok ? 'block' : 'none';
        error.style.display = res.ok ? 'none' : 'block';
        if (res.ok) form.reset();
      } catch (err) {
        error.style.display = 'block';
        success.style.display = 'none';
      }
    };
  </script>
</body>

</html>
